<!doctype html>
<!-- Variant C: CARD MIRROR — the header becomes the popup card's anatomy: tier spine,
     2x2 quiet-label tiles, pill chip row. The whole app speaks one design language.
     Tap the condition chip to cycle conditions. -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · Card Mirror</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         -webkit-font-smoothing: antialiased; background: #0b1622; color: #f8fafc; }
  .map { position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 60% 45% at 50% 66%, rgba(56,132,168,.50), transparent 70%),
      radial-gradient(ellipse 25% 18% at 38% 58%, rgba(22,101,132,.55), transparent 75%),
      radial-gradient(ellipse 20% 14% at 63% 72%, rgba(13,74,98,.6), transparent 75%),
      linear-gradient(160deg, #12202e 0%, #0d1a26 55%, #0b1622 100%); }
  header { position: relative; z-index: 10; margin: 8px 10px 0; border-radius: 14px;
    padding: 10px 12px 12px 16px; display: flex; flex-direction: column; gap: 8px;
    background: rgba(15,23,42,.78); backdrop-filter: blur(16px) saturate(1.3);
    border: 1px solid rgba(255,255,255,.09);
    box-shadow: 0 8px 24px rgba(2,18,33,.35), 0 2px 6px rgba(2,18,33,.3);
    border-left: 4px solid var(--tier-c); transition: border-color .25s; }
  .toprow { display: flex; align-items: center; gap: 8px; }
  .title { font-size: 13px; font-weight: 700; letter-spacing: .2px; }
  .chip { border: 0; border-radius: 999px; padding: 4px 11px; font-size: 11px; font-weight: 700;
    cursor: pointer; transition: background .25s; margin-left: auto; }
  .now { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.06); color: #cbd5e1; display: grid; place-items: center;
    cursor: pointer; transition: transform .12s; }
  .now:active { transform: scale(.94); }
  .tiles { display: grid; grid-template-columns: 1.4fr 1fr; gap: 6px 14px; }
  .tile .k { font-size: 11px; font-weight: 600; color: #94a3b8; }
  .tile .v { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.25; }
  .tile .v small { font-size: 11px; font-weight: 600; color: #cbd5e1; }
  .tile.hero .v { font-size: 30px; letter-spacing: -.01em; }
  .t-green { --tier-c:#22c55e; } .t-green .chip { background:#15803d; color:#fff; } .t-green .hero .v { color:#4ade80; }
  .t-yellow{ --tier-c:#facc15; } .t-yellow .chip{ background:#facc15; color:#0d1b2a; } .t-yellow .hero .v{ color:#fde047; }
  .t-amber { --tier-c:#f97316; } .t-amber .chip { background:#ea580c; color:#fff; } .t-amber .hero .v { color:#fb923c; }
  .t-red   { --tier-c:#ef4444; } .t-red .chip   { background:#b91c1c; color:#fff; } .t-red .hero .v   { color:#f87171; }
</style></head><body class="t-green">
<div class="map"></div>
<header>
  <div class="toprow">
    <span class="title">Mille Lacs</span>
    <button class="chip" id="chip" onclick="cycle()">Fishable · Light Chop</button>
    <button class="now" title="Back to now" aria-label="Back to now">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2.5"/></svg>
    </button>
  </div>
  <div class="tiles">
    <div class="tile hero"><div class="k">Avg waves</div><div class="v" id="avg">0.7 <small>ft</small></div></div>
    <div class="tile"><div class="k">Peak · Sunset Bay</div><div class="v">1.8 <small>ft</small></div></div>
    <div class="tile"><div class="k">Wind</div><div class="v">11 <small>mph · G24</small></div></div>
    <div class="tile"><div class="k">Air</div><div class="v">57<small>°F</small></div></div>
  </div>
</header>
<script>
  const tiers = [
    ['t-green','Fishable · Light Chop','0.7'],['t-yellow','Walleye Chop','1.4'],
    ['t-amber','Heavy Rollers · Expert','2.6'],['t-red','Dangerous · Stay Off','4.2']];
  let i = 0;
  function cycle(){
    i = (i+1) % tiers.length;
    document.body.className = tiers[i][0];
    document.getElementById('chip').textContent = tiers[i][1];
    document.getElementById('avg').innerHTML = tiers[i][2] + ' <small>ft</small>';
  }
</script>
</body></html>
