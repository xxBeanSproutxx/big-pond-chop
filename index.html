<style>
  :root { color-scheme: dark; --header-h: calc(84px + env(safe-area-inset-top, 0px)); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; background: #0d1b2a; color: #e8f0f7;
         font: 14px/1.3 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
/* Fixed header: the map below must never move when verdict text changes.
   Stage 6B: the header floats over the map (fixed, z-index 1001 > Leaflet's
   1000) as a frosted glass band. #map extends under it; fitLake() reserves the
   live header height + 12 px so the lake edge stays clear of the band.
   6B.2: the band is 84 px of CONTENT (it grows into the notch inset
   instead of clipping) and the top padding keeps row 1 off the bezel. */
header { position: fixed; top: 0; left: 0; right: 0; z-index: 1001;
         padding: max(11px, env(safe-area-inset-top, 0px)) 14px 11px;
         display: flex; align-items: center; gap: 13px;
         height: var(--header-h); min-height: var(--header-h);
         max-height: var(--header-h);
         overflow: hidden; background: #0f172a;
         border-bottom: 1px solid rgba(255,255,255,.08); color: #f8fafc;
         font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; }
/* v1.3 rework: header matches the deck's solid #0f172a (Reid: cohesion) — the old
   frosted rgba(15,23,42,.72)+blur read lighter than the footer over the pale map. */
/* 6B.2: the map now starts at y=0 (the header is fixed), so Leaflet's own top
   controls would sit UNDER the band. Offset the whole top strip below the header + 10 px. */
.leaflet-top { top: calc(var(--header-h) + 10px); }
/* 6.2: zoom stack docked BOTTOM-RIGHT. */
.leaflet-top.leaflet-left { top: auto; bottom: 20px; left: auto; right: 6px; }
.leaflet-top.leaflet-left .leaflet-control { margin: 0; }
header h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Hero block — ported from sketch 009 faithfully. */
.hero { display: flex; flex-direction: column; line-height: 1; min-width: 0; }
.hero .lab { font-size: 10px; font-weight: 600; letter-spacing: .14em; color: #94a3b8;
  text-transform: uppercase; margin-bottom: 5px; }
.numrow { display: flex; align-items: flex-end; gap: 7px; }
.hero .num { font-size: 38px; font-weight: 800; font-variant-numeric: tabular-nums;
  letter-spacing: -.02em; transition: color .25s; min-width: 2ch; }
.hero .num small { font-size: 14px; font-weight: 600; color: #cbd5e1; margin-left: 2px; }
.hero .sub { font-size: 11.5px; color: #94a3b8; margin-top: 6px; font-variant-numeric: tabular-nums;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero .sub b { color: #e2e8f0; font-weight: 600; }
.meter { padding-bottom: 7px; }
.bars { display: flex; align-items: flex-end; gap: 2.5px; height: 22px; }
.bar { width: 5px; border-radius: 2px 2px 0 0; background: rgba(148,163,184,.22); transition: background .25s; }
.bar:nth-child(1){height:5px}.bar:nth-child(2){height:7px}.bar:nth-child(3){height:9px}
.bar:nth-child(4){height:11px}.bar:nth-child(5){height:13px}.bar:nth-child(6){height:16px}
.bar:nth-child(7){height:19px}.bar:nth-child(8){height:22px}
.bar.on { background: var(--tier-c); }

/* Side column: row 1 = chip + refresh circle, row 2 = wind pills; both right-aligned,
   centered vertically in the band (Reid tidy pass: the 48px boxy button dominated). */
.side { display: flex; flex-direction: column; align-items: flex-end; justify-content: center;
        gap: 7px; margin-left: auto; }
.row { display: flex; gap: 6px; align-items: center; }

/* Tier classes on header: drive --tier-c for the gauge bars only. The number stays
   production white — the app keeps tier color to one functional signal per element
   (chip + bars), no glow (Reid, post-port rework). */
.t-green { --tier-c:#22c55e; }
.t-yellow{ --tier-c:#facc15; }
.t-amber { --tier-c:#f97316; }
.t-red   { --tier-c:#ef4444; }

#comfort-chip { flex: 0 0 auto; font-size: 11px; font-weight: 700; border-radius: 999px;
                   padding: 3px 9px; white-space: nowrap; line-height: 1.25; }
.tier-green { background: #15803d; color: #fff; }
.tier-yellow { background: #facc15; color: #0d1b2a; }
.tier-amber { background: #ea580c; color: #fff; }
.tier-red { background: #dc2626; color: #fff; }
@media (max-width: 400px) {
  #comfort-chip { font-size: 10px; padding: 2px 5px; }
}

/* 6.2: explicit wind line — words, not pills (Reid: "say wind… mph so it's obvious").
   The lake pill's tier tint is retired with the pills: color stays chip + bars only. */
#three { flex: 0 0 auto; display: flex; align-items: baseline; font-size: 12px;
         font-weight: 600; color: #94a3b8; line-height: 1.2; white-space: nowrap;
         font-variant-numeric: tabular-nums; }
#lake, #gust { font-size: 13px; font-weight: 700; color: #e2e8f0;
               font-variant-numeric: tabular-nums; line-height: 1.2; }
.wunit { color: #94a3b8; }
.wdot { margin: 0 5px; color: #64748b; }

/* 6B.3: marine-glass refresh button. */
/* Refresh: quiet 30px circle matching the chip row's scale — was a 48px box that
   dominated the wind row (Reid tidy pass). Icon sized in CSS; svg attrs are fallback. */
#refresh { background: rgba(255,255,255,.05); color: #cbd5e1;
            border: 1px solid rgba(255,255,255,.15); border-radius: 999px;
            width: 30px; min-width: 30px; height: 30px; min-height: 30px; padding: 0;
            display: inline-flex; align-items: center; justify-content: center;
            touch-action: manipulation; transition: transform 120ms; }
  #refresh:active { transform: scale(.96); }
  #refresh .icon { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4;
                   stroke-linecap: round;
                   stroke-linejoin: round; display: block; }
  #map { flex: 1 1 auto; min-height: 0; height: auto; overflow: hidden; background: #14283b; position: relative; }
  /* On-map wind badge, docked top-right (the horizon toggle now owns the top-left corner
     and the zoom stack + attribution live bottom-right, so nothing shares this corner). */
  #wind-badge { position: absolute; top: calc(var(--header-h) + 12px); right: 12px; z-index: 500; display: flex;
                align-items: center; gap: 6px; height: 32px; border-radius: 16px;
                background: rgba(16,38,58,.85); padding-right: 12px; }
  #wind-badge-disc { width: 32px; height: 32px; display: flex; align-items: center;
                     justify-content: center; flex: 0 0 32px; }
  #wind-badge-arrow { display: block; transform-origin: 50% 50%; }
  #wind-badge-text { font-size: 12px; color: #e8f0f7; font-variant-numeric: tabular-nums;
                     white-space: nowrap; }
  /* Loading skeleton (covers the map until the first painted frame). */
  #boot { position: absolute; inset: 0; z-index: 700; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 10px; padding-top: 72px;
          background: rgba(13,27,42,.92); color: #e8f0f7; font-size: 13px; }
  #boot.hidden { display: none; }
  #boot-track { width: min(240px, 60%); height: 6px; border-radius: 3px;
                background: #1d4e6f; overflow: hidden; }
  #boot-bar { width: 0; height: 100%; background: #ffd166; transition: width .15s linear; }
  #boot.indeterminate #boot-bar { width: 40%; animation: boot-slide 1.1s ease-in-out infinite; }
  @keyframes boot-slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
  body.reduced-motion #boot.indeterminate #boot-bar { animation: none; width: 100%; opacity: .55; }
  /* Stage 5M: single full-height scrolling tape — day header + hour ticks + wind row. */
  :root { --deck-h: 108px; }
  body { height: 100vh; height: 100dvh; }
  #deck {
    flex: 0 0 auto;
    height: calc(var(--deck-h) + env(safe-area-inset-bottom, 0px));
    padding: 0 8px;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: #0f172a; overflow: visible;
    position: relative; z-index: 1100; /* the amber pill floats above the deck edge (Windy) */
    touch-action: none;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
  }
  .deck-row  { overflow: hidden; }
  .deck-track{ overflow: visible; position: relative; } /* pill floats above; play overlays */
  .deck-track{ height: 108px; display: flex; align-items: stretch; }
  /* 6.2: the horizon toggle OWNS the top-left map corner now that the zoom stack is
     docked bottom-right — it used to start at left: 56 px purely to clear the 44 px
     zoom control. 12 px matches #wind-badge's 12 px on the opposite corner. */
  #horizon { position: absolute; top: calc(var(--header-h) + 12px); left: 12px; z-index: 1000; display: flex; gap: 4px; }
  #horizon button { height: 28px; min-height: 28px; padding: 0 9px; background: rgba(16,38,58,.85);
                    color: #e8f0f7; border: 1px solid #33506b; border-radius: 14px;
                    font: 11px/1 system-ui, sans-serif; touch-action: manipulation; }
  #horizon button[aria-pressed="true"] { background: #ffd166; color: #10263a; border-color: #ffd166; }
  /* #timeline is the viewing window: the tape scrolls under a fixed centre reticle. */
  #timeline { position: relative; flex: 1 1 auto; min-width: 0; height: 108px; overflow: hidden;
              border-radius: 4px; background: #262930; }
  /* Wide filmstrip tape; translated by the single writeTape() path in render.js. */
  #track-tape { position: absolute; left: 0; top: 0; height: 100%;
                transition: transform .32s linear; will-change: transform; }
  #now-tick       { position: absolute; top: 0; bottom: 0; width: 2px; background: #ffd166;
                    box-shadow: 0 0 0 1px rgba(13,27,42,.6); pointer-events: none;
                    /* v1.1: the hairline's LEFT edge used to sit exactly on the now-frame's
                       centre (the pill read 1px off — Reid); centre it like every other
                       centre-anchored tick. z1 = under the lane glyphs (z2) so it never
                       covers temp/wind text, but over day-block backgrounds. */
                    transform: translateX(-50%); z-index: 1; }
  /* v1.1: lane glyphs paint ABOVE the now hairline (z1) — the hairline reads as a
     background mark inside the 108px deck (Reid: "covering up the temperature and
     wind speed icons and text"). Backgrounds/curve/ribbons stay below it. */
  .day-head, .day-sub, .day-temp, .day-wind, .day-rain-label, .day-sun, .day-rain-drop { z-index: 2; }
  /* v1.1: faint gray guide at the reticle — the scrubbing reading column. Lives INSIDE
     the tape so it slots between day-block backgrounds (auto) and the lane glyphs (z2),
     same layer family as the now hairline (z1). render.js counter-translates it in the
     single tape-write path and mirrors the tape's glide state, so it stays pinned to
     the reticle column — the tape slides under it. left:-.5px centres the 1px line on
     that column (it was a translateX(-50%) sibling before the move inside the tape).
     Opacity .45: behind the glyphs it no longer gets the "dimming over content" pop it
     had as a top layer — .28 read as invisible on-device (Reid), .45 restores it while
     staying well under the tick's intensity. */
  #center-guide   { position: absolute; top: 0; bottom: 0; left: -0.5px; width: 1px;
                    background: rgba(148,163,184,.45); z-index: 1;
                    transition: transform .32s linear; /* mirrored by the drag path */
                    pointer-events: none; }
  /* Amber pill cursor IS the permanent time indicator, anchored to the centre of the
     viewing window. It floats ABOVE the timeline edge (Windy reference) so it never
     covers a day header; the stem dips into the bar. The element never moves. */
  #time-pill      { position: absolute; top: -20px; left: 50%; width: 68px; height: 20px; line-height: 20px;
                    border-radius: 10px; background: #d69e0b; color: #ffffff;
                    font: 700 12px/20px system-ui, -apple-system, sans-serif;
                    font-variant-numeric: tabular-nums; text-align: center; white-space: nowrap;
                    pointer-events: none; box-shadow: 0 2px 6px rgba(0,0,0,.45);
                    transform: translateX(-50%); }
  #time-pill::after { content: ""; position: absolute; left: 50%; top: 100%; margin-left: -5px;
                      border-left: 5px solid transparent; border-right: 5px solid transparent;
                      border-top: 9px solid #d69e0b; }
  /* Stage 5F timeline: solid segmented day blocks + 3 h sub-row. */
  #track-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  #track-days, #track-ticks { position: absolute; inset: 0; pointer-events: none; }
  #track-days { overflow: hidden; border-radius: 4px; } /* rounded day ends without clipping the pill */
  .day-block { position: absolute; top: 0; bottom: 0; background: #23272e; overflow: hidden; }
  .day-block.alt { background: #1b1d22; }
  .day-block + .day-block { border-left: 1px solid #4a5568; }
  .day-head { position: absolute; top: 3px; left: 50%; transform: translateX(-50%);
              font: 600 12px/1 system-ui, -apple-system, sans-serif; color: #e8f0f7; white-space: nowrap; }
  .day-sub { position: absolute; top: 83px; transform: translateX(-50%);
             font: 11px/1 system-ui, -apple-system, sans-serif; color: #94a3b8; white-space: nowrap;
             font-variant-numeric: tabular-nums; width: 20px; text-align: center; }
  .day-sub.edge { color: #e8f0f7; } /* midnight/boundary ticks read stronger than the 3 h row */
   /* v1.1 lane bands (108px deck, disjoint by construction — see tools/qa/lane_audit.py):
      [3,15] day-head · [17,29] temps · [32,41] rain % labels (own row, above the curve)
      · [41,59] rain curve (18px) · [61,81] wind ribbon + numbers · [83,94] clock hours
      (the yellow now-hairline floats UNDER the lane glyphs, over backgrounds) · [94.25,105.25] sun/moon glyphs (11px, -0.25px sub-pixel lift).
      Never place a lane without re-allocating all bands. */
  .day-wind { position: absolute; top: 61px; transform: translateX(-50%);
              font: 700 12px/1 system-ui, -apple-system, sans-serif; color: #ffffff;
              text-shadow: 0 1px 2px rgba(0, 0, 0, .65);
              white-space: nowrap; font-variant-numeric: tabular-nums;
              height: 20px; line-height: 20px; width: 20px; text-align: center; }
  /* 5P wind heat ribbon: one continuous gradient per day block, flush along the bottom,
     painted behind the numbers (DOM order). */
  .day-heat { position: absolute; left: 3px; right: 3px; bottom: 27px; height: 20px;
              border-radius: 3px; }
  .day-temp { position: absolute; top: 17px; transform: translateX(-50%);
              font: 500 10px/1 system-ui, -apple-system, sans-serif;
              white-space: nowrap; font-variant-numeric: tabular-nums;
              height: 12px; line-height: 12px; width: 20px; text-align: center;
              pointer-events: none; }
  .day-rain-svg { position: absolute; left: 3px; right: 3px; bottom: 49px; height: 28px;
                  pointer-events: none; }
  .day-rain-label { position: absolute; top: 39px; transform: translateX(-50%);
                    font: 500 9px/1 system-ui, -apple-system, sans-serif; color: #ffffff;
                    white-space: nowrap; pointer-events: none;
                    /* 4-layer navy outline: separates the glyphs from the curve
                       even at 1.5px stroke, without a box (same family as the
                       wind numbers' shadow, one step deeper) */
                    /* 4-layer navy outline, deepened (Reid: "a hair darker") */
                    text-shadow: 0 0 3px rgba(10,20,33,1), 1px 0 2px rgba(10,20,33,1),
                                 -1px 0 2px rgba(10,20,33,1), 0 1.5px 3px rgba(5,12,20,1); }
  .day-rain-drop { color: #38bdf8; }
  .day-rain-drop svg { width: 8px; height: 8px; vertical-align: -0.5px; }
  .day-rain-label.dim { opacity: .45; } /* flat-day label: present but quiet */
  /* 15 d horizon, days 11-15: outlook-grade — same dim language as flat-day
     labels (head + rain label), so the far week reads "softer" at a glance
     without new chrome. No effect on the 7 d horizon. */
  .day-block.outlook .day-head { color: #8a97a8; }
  .day-block.outlook .day-rain-label { opacity: .45; }
  /* Sunrise/sunset markers: 11px feather-style glyphs (sun = filled disc + rays,
     sunset = crescent). The deck rasterises these onto a ~1 css px grid (measured:
     the two reachable slots around the bar centre are +1.03 / -2.05 device px at 3x),
     so no `bottom` value alone lands on the centre — position picks the closest slot
     (2.25px = safely inside the better one) and the sub-pixel transform below
     finishes the job (transforms are not snapped). -0.25px = min-max across
     device pixel ratios 2 → 3; extra -0.30px = hand-tuned "hairs up" (Reid, two
     of them) — set this transform's number back to -0.25px to revert the nudges.
     Colours fully opaque so the bar never reads through.
     pointer-events ON for the tap tooltip. */
  .day-sun { position: absolute; bottom: 2.25px; width: 11px; height: 11px;
             transform: translateX(-50%) translateY(-0.55px); }
  .day-sun svg { display: block; width: 100%; height: 100%; }
  .day-sun-rise { color: #f6a623; }
  .day-sun-set { color: #e2d2aa; }
  /* Day/night strip: one gradient div connecting sun -> moon (orange day, dark blue
     night). Painted BEFORE the icons so the glyphs sit on their endpoints. Same band
     as the icons — overlap with .day-sun is by design (lane_audit allowlist). */
  .day-night-bar { position: absolute; left: 3px; right: 3px; bottom: 6px; height: 4px;
                   border-radius: 2px; pointer-events: none; }
  /* Stage 5L/5M. 6B.4 / 6.1: docked FLUSH to the deck (bottom: 4px, measured against
     #map whose bottom edge IS the deck's top) and trimmed to 134px so it ends at
     x = 142 on a 360px viewport — clearing the amber reticle's left edge (x = 146)
     with zero horizontal collision. */
  #legend-card { position: absolute; left: 8px; bottom: 4px !important; margin: 0;
                 z-index: 500; pointer-events: none;
                 background: rgba(16,38,58,.85); border-radius: 8px; padding: 5px 6px; }
  /* 6.2: names the ramp. The key's numbers alone read as ambiguous (mph? ft?) — and
     the timeline's wind ribbon uses the same warm palette, so a bare number row invites
     conflation (Reid). 8px keeps the card's width at 134px (the 122px bar governs it),
     so the documented 360px collision budget vs the reticle (x=146) is unchanged. */
  #legend-card-title { font-size: 8px; line-height: 1; letter-spacing: .04em;
                       text-transform: uppercase; color: #9fc3dd; margin-bottom: 3px; }
  #legend-card-bar { width: 122px; height: 11px; border-radius: 3px; border: 1px solid #33506b; }
  #legend-card-ticks { width: 122px; margin-top: 2px; display: flex; justify-content: space-between;
                       font-size: 8px; line-height: 1; color: #9fc3dd; }
  #track:focus-visible { outline: 2px solid #ffd166; outline-offset: -2px; }
  /* Play control pinned to the window's left edge: icon only, no chrome. It overlays the
     tape (no flex space) so the tape scrolls behind it; the faint scrim keeps the glyph legible. */
  #play { position: absolute; left: 0; top: 0; z-index: 10;
          width: 48px; height: 48px; display: inline-flex; align-items: center;
          justify-content: center;
          background: linear-gradient(90deg, rgba(16,38,58,.85), rgba(16,38,58,0));
          color: #e8f0f7;
          border: 0; border-radius: 0; font-size: 12px; padding: 0;
          touch-action: manipulation; }
  #play .icon { fill: currentColor; display: block; width: 20px; height: 20px; }
  #play .icon-pause { display: none; }
  #play[data-state="pause"] .icon-play { display: none; }
  #play[data-state="pause"] .icon-pause { display: block; }
  #readout { font-size: 12px; color: #cfe3f2; min-height: 1.2em; font-variant-numeric: tabular-nums; }
  #note { display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
          z-index: 600; background: #5a1f1f; color: #ffd7d7; padding: 8px 12px; border-radius: 8px;
          font-size: 13px; align-items: center; gap: 10px; }
  #note-retry { background: #ffd7d7; color: #5a1f1f; border: 0; border-radius: 5px;
                padding: 6px 10px; font-size: 12px; font-weight: 700; touch-action: manipulation; }
  /* v1.2 rev7: the card wears its condition on the edge — a tier-coloured spine matching
     the Conditions tag (same palette as .tier-*). Quiet labels, roomier shape. */
  #card { position: absolute; left: 10px; top: 122px; z-index: 550; min-width: 230px;
          background: #ffffff; color: #0d1b2a; border: 1px solid #cbd5e1;
          border-left: 4px solid #cbd5e1; border-radius: 12px; padding: 10px 46px 10px 12px;
          font-size: 12px;
          box-shadow: 0 8px 24px rgba(2,18,33,.30), 0 2px 6px rgba(2,18,33,.18);
          font-variant-numeric: tabular-nums; }
  #card[data-tier="green"] { border-left-color: #15803d; }
  #card[data-tier="yellow"] { border-left-color: #facc15; }
  #card[data-tier="amber"] { border-left-color: #ea580c; }
  #card[data-tier="red"] { border-left-color: #dc2626; }
  #card .card-line { margin: 2px 0; }
  #card .card-line b { display: inline-block; min-width: 9em; }
  #card .card-line b, #card-copy b { color: #64748b; font-size: 11px; font-weight: 600;
                                     letter-spacing: .01em; }
  #card [data-field="when"] .v { font-weight: 700; }
  #card .pill { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 3px;
                padding: 2px 6px; vertical-align: middle; white-space: nowrap; line-height: 1.25; }
  #card .card-sep { border-top: 1px solid #e2e8f0; margin-top: 6px; padding-top: 4px; }
  #card-copy { display: flex; justify-content: space-between; align-items: center; gap: 8px;
               width: 100%; min-height: 44px; margin-top: 3px; padding: 0;
               border: 0; border-top: 1px solid #e2e8f0; background: none; font: inherit;
               color: inherit; text-align: left; cursor: pointer; touch-action: manipulation; }
  #card-copy:active { background: #eef4fa; }
  #card-copy b { display: inline-block; min-width: 9em; }

  #card-copy .icon { width: 18px; height: 18px; display: block; }
  #card-copy .icon-copy { fill: none; stroke: #2563eb; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #card-copy .icon-check { display: none; fill: none; stroke: #15803d; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #card-copy.done .icon-copy { display: none; }
  #card-copy.done .icon-check { display: block; }
  #card-copy.fail .icon-copy { stroke: #b91c1c; }
  #card-copy .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
                        overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  #card-close { position: absolute; right: 2px; top: 2px; width: 48px; height: 48px;
                border: 0; background: transparent; color: #0d1b2a; font-size: 20px;
                line-height: 1; cursor: pointer; touch-action: manipulation; }
  body.reduced-motion * { transition: none !important; animation: none !important; }
  /* Muted basemap: CARTO's keyless tiles now stamp "API KEY REQUIRED", so the tile pane
     itself is desaturated instead — kills the green/wetland clash under the wave overlay. */
  .leaflet-tile-pane { filter: grayscale(.9) saturate(.35) brightness(1.04) contrast(.94); }
  /* Stage 5J / 6B.3 / 6.1: both bottom elements sit FLUSH on the deck (4 px against
     #map, whose bottom edge IS the deck's top). The corner is positioned against #map,
     not the viewport, which is why "deck-h + 4px" previously resolved to 66 px. */
  .leaflet-bottom { bottom: calc(var(--deck-h) + 6px); }
  .leaflet-bottom.leaflet-right { bottom: 4px !important; right: 6px; margin: 0; }
  /* 6B.4 / 6.1: no box, no shadow, no blur — crisp muted slate that stays sharp on the
     light desaturated tiles. #64748b at 9px/500 measures ~4.0:1 there (the previous
     #94a3b8 needed the text-shadow and measured ~2.6:1 without it). */
  .leaflet-control-attribution { background: none !important; box-shadow: none !important;
                                 color: #64748b; font-size: 9px; font-weight: 500;
                                 text-shadow: none; }
  .leaflet-control-attribution a { color: #64748b; }
  #field { display: none; }
</style>
</head>
<body data-hour="" data-hs-ft="" data-hmax-ft="" data-wind-mph="" data-bearing-grid="" data-teff-h="">
  <header>

        <div class="meter" aria-hidden="true">
          <div class="bars" id="gauge-bars">

      <div class="row">

        <button id="refresh" type="button" aria-label="Back to now — recenters map, refreshes data" title="Back to now — recenters map, refreshes data">
          <svg class="icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">

      <div class="row">
        <div id="three" role="group" aria-label="Wind">
          Wind <b id="lake">17</b><span class="wunit"> mph</span><span class="wdot" aria-hidden="true">·</span>Gust <b id="gust">24</b><span class="wunit" id="gust-u"> mph</span>

  <div id="map">

    </div>
    <div id="card" hidden>
      <button id="card-close" type="button" aria-label="Dismiss readout">×</button>
      <div class="card-line" data-field="when"><b>Time:</b> <span class="v">—</span></div>
      <div class="card-line" data-field="spot"><b>Spot:</b> <span class="v">—</span></div>
      <div class="card-line" data-field="tier"><b>Conditions:</b> <span id="card-tier" class="pill tier-green">—</span></div>
      <div class="card-line card-sep" data-field="hs"><b>Avg. Wave Height:</b> <span class="v">—</span></div>

      <div class="card-line" data-field="depth"><b>Depth:</b> <span class="v">—</span></div>

        <svg class="icon icon-pause" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
      </button>
    </div>
  </footer>
  <canvas id="field"></canvas>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  (function () {
    var cache = {};
    function resolve(from, req) {
      if (req.charAt(0) !== '.') return req + '.js';
      var base = from.split('/'); base.pop();
      var parts = req.split('/');
      for (var k = 0; k < parts.length; k++) {
        var p = parts[k];
        if (p === '.' || p === '') continue;
        if (p === '..') base.pop(); else base.push(p);
      }
      var out = base.join('/');
      return out.slice(-3) === '.js' ? out : out + '.js';
    }
    async function load(path) {
      if (cache[path]) return cache[path].exports;
      // no-store: module code must never come from the browser's heuristic HTTP
      // cache. Plain fetch() here let a stale module (e.g. render.js) ride along
      // with a fresh document after a deploy — new HTML + old JS = mismatched
      // app (off-screen centre guide, v1.1 debugging 2026-10-07). The SW still
      // serves its cache as the offline fallback when it controls the page.
      var res = await fetch(path, { cache: 'no-store' });
      if (!res.ok) throw new Error('load ' + path + ': HTTP ' + res.status);
      var src = await res.text();
      var mod = { exports: {} };
      cache[path] = mod;
      var require = function (req) {
        var p = resolve(path, req);
        if (!cache[p]) throw new Error('missing module ' + p);
        return cache[p].exports;
      };
      new Function('module', 'exports', 'require', src)(mod, mod.exports, require);
      return mod.exports;
    }
    (async function () {
      try {
        var tables = await load('src/tables.js');
        var wave = await load('src/wave-math.js');
        var wind = await load('src/wind.js');
        var sunTimes = await import('./src/sun-times.mjs');
        var ui = await load('src/ui.js');
        var render = await load('src/render.js');
        await render.mount({ tables: tables, wave: wave, wind: wind, sunTimes: sunTimes, render: render, ui: ui });
      } catch (err) {
        console.error(err);
        var m = document.getElementById('note-msg');
        if (m) m.textContent = 'wind unavailable — retry';
        var n = document.getElementById('note');
        if (n) n.style.display = 'flex';
      }
    })();
  })();
  </script>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () {});
    });
  }
  </script>
</body>
